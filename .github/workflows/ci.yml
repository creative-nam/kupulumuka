name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Debug — dump SW CSS precache entries
        run: |
          echo "=== SW file size ==="
          wc -c public/sw.js
          echo "=== CSS chunk entries ==="
          grep -oP '/_next/static/chunks/[^"]*\.css[^}]*revision:"[0-9a-f]{8}"' public/sw.js || echo "(none found)"
          echo "=== All .css references in SW ==="
          grep -oP '/_next/static/[^"]*\.css' public/sw.js || echo "(none found)"
          echo "=== SW first 300 chars ==="
          head -c 300 public/sw.js
      - run: npm run test

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    env:
      DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
      TEST_DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Ensure Prisma client is generated
        run: npx prisma generate
        env:
          DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
      - run: npm run test:integration

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Ensure Prisma client is generated
        run: npx prisma generate
        env:
          DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
      - name: Debug — query shelter count from TEST_DIRECT_URL
        run: npx prisma db execute --stdin <<< "SELECT COUNT(*) AS shelter_count FROM \"Shelter\";"
        env:
          DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
      - run: npm run build

  e2e:
    name: E2E Tests
    needs: build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.TEST_DIRECT_URL }}
      DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Ensure Prisma client is generated
        run: npx prisma generate
        env:
          DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
